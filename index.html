<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ti ❤️</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- Barra de instrucciones superior -->
    <div id="hud">
        <div id="hud-icono">🎯</div>
        <div id="hud-texto">Haz clic en los 3 corazones</div>
        <div id="hud-contador">0 / 3</div>
    </div>

    <!-- Puntos de progreso de fotos -->
    <div id="progreso">
        <div class="punto"></div>
        <div class="punto"></div>
        <div class="punto"></div>
        <div class="punto"></div>
        <div class="punto"></div>
    </div>

    <!-- Título y texto de la historia -->
    <div id="historia">
        <h1 id="historia-titulo"></h1>
        <p id="historia-texto"></p>
    </div>

    <!-- Pantalla de bienvenida -->
    <div id="intro">
        <div class="intro-panel">
            <h1>Bienvenida ❤️</h1>
            <p>Este es un pequeño universo hecho para ti.</p>
            <p>Para ver cada foto, tendrás que completar un desafío. ¡Vamos!</p>
            <button id="btn-empezar">Empezar ✨</button>
        </div>
    </div>

    <!-- Código del desafío final -->
    <div id="codigo" class="oculto">
        <p>MEMORIZA EL ORDEN</p>
        <div id="codigo-colores"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
