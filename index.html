<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Para Ti ❤️</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
</head>
<body>

    <img id="fondo-baile" src="Baile.gif" alt="Fondo">

    <!-- ⭐ preload + playsinline son CLAVE para móvil -->
    <audio id="musica-fondo" loop preload="auto" playsinline webkit-playsinline>
        <source src="Musica.mp3" type="audio/mpeg">
        Tu navegador no soporta audio.
    </audio>

    <div id="canvas-container"></div>

    <div id="hud">
        <div id="hud-nivel">NIVEL 1 / 5</div>
        <div id="hud-icono">🔮</div>
        <div id="hud-texto">Toca el orbe dorado</div>
        <div id="hud-info">
            <div id="hud-contador">0 / 1</div>
            <div id="hud-timer" class="oculto">20s</div>
        </div>
    </div>

    <div id="progreso">
        <div class="punto"></div>
        <div class="punto"></div>
        <div class="punto"></div>
        <div class="punto"></div>
        <div class="punto"></div>
    </div>

    <div id="historia">
        <h1 id="historia-titulo"></h1>
        <p id="historia-texto"></p>
    </div>

    <div id="intro">
        <div class="intro-panel">
            <h1>Para Ti</h1>
            <p>Un universo hecho con amor</p>
            <p class="intro-sub">Completa los 5 desafíos para desbloquear cada recuerdo</p>
            <button id="btn-empezar">EMPEZAR ✨</button>
        </div>
    </div>

    <div id="codigo" class="oculto">
        <p>MEMORIZA EL ORDEN</p>
        <div id="codigo-colores"></div>
    </div>

    <div id="toast" class="oculto"></div>

    <script src="script.js"></script>
</body>
</html>
